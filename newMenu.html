<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Model Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <link rel="stylesheet" href="modelviewer_style.css" />
  <link rel="stylesheet" href="https://use.typekit.net/zfi8dmc.css" />
</head>

<body>
  <model-viewer
    id="modelViewer"
    shadow-intensity="1"
    shadow-softness="1"
    camera-controls
    touch-action="pan-y, pan-x, none"
    camera-orbit="-25deg 75deg auto"
    scale="1 1 1"
    orbit-sensitivity="2"
    ar-modes="webxr scene-viewer quick-look"
  >
    <!-- Hotspots -->
    <button style="background-color:rgb(0,0,0)" slot="hotspot-dot+X-Y+Z" class="dot" data-position="1 -1 1" data-normal="1 0 0"></button>
    <button slot="hotspot-dim+X-Y" class="dim" data-position="1 -1 0" data-normal="1 0 0"></button>
    <button style="background-color:rgb(0,0,0)" slot="hotspot-dot+X-Y-Z" class="dot" data-position="1 -1 -1" data-normal="1 0 0"></button>
    <button slot="hotspot-dim+X-Z" class="dim" data-position="1 0 -1" data-normal="1 0 0"></button>
    <button style="background-color:rgb(0,0,0)" slot="hotspot-dot+X+Y-Z" class="dot" data-position="1 1 -1" data-normal="0 1 0"></button>
    <button slot="hotspot-dim+Y-Z" class="dim" data-position="0 -1 -1" data-normal="0 1 0"></button>
    <button style="background-color:rgb(0,0,0)" slot="hotspot-dot-X+Y-Z" class="dot" data-position="-1 1 -1" data-normal="0 1 0"></button>
    <button slot="hotspot-dim-X-Z" class="dim" data-position="-1 0 -1" data-normal="-1 0 0"></button>
    <button style="background-color:rgb(0,0,0)" slot="hotspot-dot-X-Y-Z" class="dot" data-position="-1 -1 -1" data-normal="-1 0 0"></button>
    <button slot="hotspot-dim-X-Y" class="dim" data-position="-1 -1 0" data-normal="-1 0 0"></button>
    <button style="background-color:rgb(0,0,0)" slot="hotspot-dot-X-Y+Z" class="dot" data-position="-1 -1 1" data-normal="-1 0 0"></button>

    <svg id="dimLines" width="100%" height="100%" class="dimensionLineContainer">
      <line class="dimensionLine"></line>
      <line class="dimensionLine"></line>
      <line class="dimensionLine"></line>
      <line class="dimensionLine"></line>
      <line class="dimensionLine"></line>
    </svg>

    <img id="ar-button" src="icon/arbtn.png" slot="ar-button" alt="AR Button" />
  </model-viewer>

  <div id="buttonsGRP">
    <a href="newMenu.html">
      <img class="return" src="icon/returnbtn.png" alt="Return" />
    </a>
    <img class="specification" src="icon/infobtn.png" alt="Specification" id="specButton" />
  </div>

  <div id="arOverlay" class="ar-overlay">
    <div class="loadingText">
      <img src="icon/explanation.png" />
    </div>
  </div>

  <div class="spec-overlay" id="specOverlay">
    <h2>製品仕様</h2>
    <p id="specDescription"></p>
    <a id="modelLink" href="#" target="_blank" style="display:none;">製品仕様</a>
    <div id="iframeWrapper" style="display:none;">
      <button id="closeIframeBtn">×</button>
      <iframe title="model" id="modelIframe"></iframe>
    </div>
    <img src="icon/returnbtn.png" class="close-spec" id="closeSpec" />
  </div>

  <script type="module">
    // Get model URL from query string
    const urlParams = new URLSearchParams(window.location.search);
    let modelGlb = urlParams.get("model") || "models/model1.glb";

    // Extract model base name, e.g. 'model1'
    const modelName = modelGlb.split("/").pop().split(".")[0];

    // Construct URLs for GLB and USDZ
    const modelGlbUrl = `models/${modelName}.glb`;
    const modelUsdzUrl = `models/${modelName}.usdz`;

    const modelViewer = document.getElementById("modelViewer");
    modelViewer.setAttribute("src", modelGlbUrl);
    modelViewer.setAttribute("ios-src", modelUsdzUrl + `#callToAction=Learn%20More&link=https://example.com/details/${modelName}`);

    // Model specs data (you can replace this with JSON fetch if needed)
    const modelSpecs = {
      model1: {
        title: "Model 1",
        description:
          "木製フレームと布張りの座面を備えたモダンなデザインの椅子。軽量で耐久性があります。",
        link: "https://example.com/details/model1",
      },
      model2: {
        title: "Model 2",
        description:
          "最大6人まで対応可能。ガラス天板と金属脚を備えたスタイリッシュなダイニングテーブル。",
        link: "https://example.com/details/model2",
      },
      model3: {
        title: "Model 3",
        description: "LEDライト内蔵のモダンな天井ランプ。省エネで温かい光を提供します。",
        link: "https://example.com/details/model3",
      },
      // Add more models here as needed...
    };

    // Elements for spec overlay
    const specButton = document.getElementById("specButton");
    const specOverlay = document.getElementById("specOverlay");
    const closeSpec = document.getElementById("closeSpec");
    const modelLink = document.getElementById("modelLink");
    const specDescription = document.getElementById("specDescription");
    const iframeWrapper = document.getElementById("iframeWrapper");
    const modelIframe = document.getElementById("modelIframe");
    const closeIframeBtn = document.getElementById("closeIframeBtn");

    // Load specs dynamically
    if (modelSpecs[modelName]) {
      const spec = modelSpecs[modelName];
      specOverlay.querySelector("h2").textContent = spec.title;
      specDescription.textContent = spec.description;

      if (spec.link) {
        modelLink.style.display = "inline";
        modelLink.href = spec.link;
        modelLink.onclick = (e) => {
          e.preventDefault();
          modelIframe.src = spec.link;
          iframeWrapper.style.display = "block";
        };
      } else {
        modelLink.style.display = "none";
      }
    } else {
      specOverlay.querySelector("h2").textContent = "仕様情報がありません";
      specDescription.textContent = "このモデルの仕様はまだ登録されていません。";
      modelLink.style.display = "none";
    }

    specButton.addEventListener("click", () => {
      specOverlay.style.display = "flex";
    });

    closeSpec.addEventListener("click", () => {
      specOverlay.style.display = "none";
      iframeWrapper.style.display = "none";
      modelIframe.src = "";
    });

    closeIframeBtn.addEventListener("click", () => {
      iframeWrapper.style.display = "none";
      modelIframe.src = "";
    });

    // AR button and overlay handling
    const arButton = document.querySelector("#ar-button");
    const arOverlay = document.getElementById("arOverlay");
    let arJustStarted = false;
    let arTimeout = null;

    function startAR() {
      arOverlay.style.display = "none";
      arJustStarted = false;
      modelViewer.activateAR();
    }

    arButton.addEventListener("click", (event) => {
      if (!arJustStarted) {
        event.preventDefault();
        event.stopPropagation();

        arOverlay.style.display = "flex";
        arJustStarted = true;

        arTimeout = setTimeout(() => {
          startAR();
        }, 5000);
      }
    });

    arOverlay.addEventListener("click", () => {
      if (arJustStarted) {
        clearTimeout(arTimeout);
        startAR();
      }
    });

    modelViewer.addEventListener("ar-status", (event) => {
      if (event.detail.status === "not-presenting") {
        arOverlay.style.display = "none";
        arJustStarted = false;
        clearTimeout(arTimeout);
      }
    });

    // Your existing hotspot, dimension lines, and camera control code can go here (if needed)...

  </script>
</body>
</html>
