<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Model Thumbnails</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"  />
    <link rel="stylesheet" href="mainpageStyle.css" >
  </head>

  <body>
      <div class="page-wrapper">
      <!-- QR container OR main content -->
      <div id="qr-container" style="display: none;">
        <p>このQRコードをスキャンしてモバイルでご覧ください：</p>
        <div id="qrcode">
          <img class="qrcode2" src="qrcode/mainWebsite.png" alt="QR Code" />
        </div>
      </div>

    <div class="bubbles" id="bubbles"></div>

    <div id="main-content">
      <div class="mainpage-container">
        <div class="mainpage-title">
          <a class="logo">
            <span class="brand-line">
            <span class="brand">HOSOKAWA</span>
            <span class="micron"> MICRON</span>
            </span>
            <br>
            <span class="catalog">ARカタログ</span>
          </a>
          <br />
          <img class="qrcode" src="qrcode/mainWebsite.png" alt="QR Code" />
        </div>
      </div>
      
      <div class="armenu-mainpage">
        <a class="arword" href="newMenu.html">AR MENU</a>
      </div>
    </div>
        
      <footer>
        <a href="https://www.hosokawamicron.co.jp/">Hosokawa Micron</a>
      </footer>
        
    </div>

    <script>
      const bubbleContainer = document.getElementById("bubbles");

      function createBubble() {
        const bubble = document.createElement("span");
        bubble.classList.add("bubble");

        // Random size between 10px and 30px
        const size = Math.random() * 20 + 10;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;

        // Random horizontal position
        bubble.style.left = `${Math.random() * 100}%`;

        // Random animation duration between 10s and 20s
        bubble.style.animationDuration = `${10 + Math.random() * 10}s`;

        // Random animation delay
        bubble.style.animationDelay = `${Math.random() * 2}s`;

        bubbleContainer.appendChild(bubble);

        // Remove the bubble after animation ends
        setTimeout(() => bubble.remove(), 20000);
      }

      // Generate new bubbles periodically
      setInterval(createBubble, 300);

      function isMobileDevice() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      }

      const qrContainer = document.getElementById("qr-container");
      const mainContent = document.getElementById("main-content");

      if (!isMobileDevice()) {
       // Hide the main site on PC
        mainContent.style.display = "none";

        // Show QR code for mobile access
        qrContainer.style.display = "block";

         Generate QR code with current URL
        new QRCode(document.getElementById("qrcode"), {
          text: window.location.href,
          width: 200,
          height: 200
        });
      }
    </script>
  </body>
</html>
